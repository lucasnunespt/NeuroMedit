<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroMedit</title>
  <link rel="icon" href="/assets/neuromedit-symbol-vector.svg" type="image/svg+xml">
  <script>
    // neuromedit.com/@nome (ou /nome) leva ao perfil dessa pessoa. O GitHub Pages serve esta página
    // para qualquer endereço que não exista, por isso é aqui que o @ se resolve.
    (function () {
      var m = location.pathname.match(/^\/@?([a-z0-9._]{3,20})\/?$/i);
      if (m && !/\.(html?|js|css|png|jpe?g|svg|json|webp|mp3|pdf)$/i.test(m[1])) location.replace("/perfil.html?u=" + encodeURIComponent(m[1].toLowerCase()));
    })();
  </script>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/theme-sync.css">
  <script src="/theme-sync.js"></script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: var(--font-sans); color: var(--text);
      background: linear-gradient(to bottom, var(--bg), var(--bg-soft)); }
    main { display: grid; gap: 16px; justify-items: center; padding: var(--gutter); text-align: center; }
    h1 { margin: 0; font-size: 1.6rem; font-weight: 600; }
    p { margin: 0; color: var(--text-soft); }
    a { display: inline-flex; align-items: center; min-height: var(--control-height); padding: 0 var(--button-pad-x); border-radius: var(--radius-pill);
      background: var(--accent); color: var(--button-text); text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/neuromedit-symbol-vector.svg" alt="" width="56" height="56">
    <h1>Esta página não existe</h1>
    <p>Pode ter mudado de endereço.</p>
    <a href="/home.html">Ir para o início</a>
  </main>
  <script src="/nav-global.js" defer></script>
</body>
</html>
